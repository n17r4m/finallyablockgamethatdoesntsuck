[workspace]
members = ["sim", "godot", "server"]
# Plain `cargo test` stays about the rules, and doesn't need the Godot bindings.
default-members = ["sim", "server"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1

# The tests simulate a lot of ticks, and keep their overflow checks while doing it.
[profile.test]
opt-level = 2
