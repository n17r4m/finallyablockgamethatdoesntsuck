<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Server Admin</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1c1c1a; --dim: #6b6b66; --line: #e2e2dc;
  --accent: #2f6fdf; --good: #1f8a4c; --warn: #b7791f; --bad: #c53030;
  --p1: #e04848; --p2: #2f9e5a; --p3: #3a6fe0; --p4: #e0b030; --p5: #9b4fd6; --gar: #8a8a92;
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --panel: #1d1d20; --ink: #e9e9e6; --dim: #9a9a94; --line: #2e2e33;
          --accent: #6b9cff; --good: #4cc17f; --warn: #e0a84a; --bad: #ef6b6b; --gar: #6e6e78; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px;
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.pill { padding: 2px 8px; border-radius: 99px; background: var(--line); font-size: 12px; white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad); }
.spacer { flex: 1; }
main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
section.wide { grid-column: 1 / -1; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
h2 .n { color: var(--ink); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--dim); font-size: 12px; }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--dim); padding: 6px 0; }
button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
         background: var(--bg); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.danger { color: var(--bad); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
input[type=text] { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input { flex: 1; }
.dim { color: var(--dim); }
.bad { color: var(--bad); } .warn { color: var(--warn); } .good { color: var(--good); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
         padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: .95; }
#watch .boards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
#watch figure { margin: 0; text-align: center; }
#watch figcaption { font-size: 13px; margin-top: 6px; }
canvas { display: block; background: var(--bg); border-radius: 6px; }
svg text { fill: var(--dim); font-size: 11px; }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 4px 8px; align-items: center; font-size: 13px; }
.bar { height: 10px; background: var(--accent); border-radius: 3px; min-width: 2px; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Block server</h1>
  <span id="health" class="pill">connecting…</span>
  <span id="counts" class="pill"></span>
  <span id="build" class="pill"></span>
  <span class="spacer"></span>
  <button id="drain">Drain</button>
  <button id="restart" class="danger" title="Stop taking matches, and stop the server once the last one ends. systemd starts it again.">Drain &amp; restart</button>
  <button id="resume" hidden>Resume</button>
</header>
<main>
  <section class="wide">
    <h2>Say something to everyone</h2>
    <div class="row"><input id="notice" type="text" maxlength="200" placeholder="Shown to every connected player"><button id="send">Send</button></div>
  </section>

  <section class="wide" id="watch" hidden>
    <h2>Watching match <span class="n" id="watch-id"></span> <span id="watch-state" class="dim"></span><span class="spacer"></span><button id="unwatch">Close</button></h2>
    <div class="boards"></div>
  </section>

  <section class="wide">
    <h2>Matches <span class="n" id="n-matches"></span></h2>
    <div class="scroll"><table id="matches"></table></div>
  </section>

  <section class="wide">
    <h2>Connections <span class="n" id="n-conns"></span></h2>
    <div class="scroll"><table id="conns"></table></div>
  </section>

  <section>
    <h2>Players, last 24 h</h2>
    <div id="chart"></div>
    <div id="totals" class="dim"></div>
  </section>

  <section>
    <h2>How matches ended, last 24 h</h2>
    <div id="reasons" class="bars"></div>
    <h2 style="margin-top:14px">Worst input lateness per player</h2>
    <div id="late" class="bars"></div>
  </section>

  <section class="wide">
    <h2>Recent matches</h2>
    <div class="scroll"><table id="history"></table></div>
  </section>

  <section>
    <h2>Bans</h2>
    <div class="row" style="margin-bottom:8px"><input id="ban-addr" type="text" placeholder="Address"><input id="ban-note" type="text" placeholder="Why"><button id="ban">Ban</button></div>
    <div class="scroll"><table id="bans"></table></div>
  </section>

  <section>
    <h2>Admin log</h2>
    <div class="scroll"><table id="audit"></table></div>
  </section>
</main>
<div id="toast"></div>
<script>
"use strict";
const HZ = 720;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ms = (ticks) => Math.round(ticks * 1000 / HZ);
const ago = (s) => s < 90 ? `${s}s` : s < 5400 ? `${Math.round(s / 60)}m` : `${(s / 3600).toFixed(1)}h`;
const when = (unix) => new Date(unix * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function toast(text, bad) {
  const t = $("toast");
  t.textContent = text;
  t.style.background = bad ? css("--bad") : "";
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 3000);
}

async function get(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function act(body, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try {
    const r = await fetch("/api/act", { method: "POST", headers: { "content-type": "application/json", "x-fbg-admin": "1" }, body: JSON.stringify(body) });
    const text = await r.text();
    toast(text, !r.ok);
  } catch (e) { toast(String(e), true); }
  refresh();
  slow();
}

function table(el, head, rows, emptyText) {
  if (!rows.length) { el.innerHTML = `<tr><td class="empty">${emptyText}</td></tr>`; return; }
  el.innerHTML = `<tr>${head.map((h) => `<th class="${h.startsWith("#") ? "num" : ""}">${h.replace(/^#/, "")}</th>`).join("")}</tr>` + rows.join("");
}

function rtt(v) {
  if (v == null) return `<span class="dim">–</span>`;
  const cls = v > 150 ? "bad" : v > 80 ? "warn" : "";
  return `<span class="${cls}">${v} ms</span>`;
}

let watching = null;
let last = null;

async function refresh() {
  let s;
  try { s = await get("/api/state"); } catch (e) {
    $("health").className = "pill bad"; $("health").textContent = "unreachable"; return;
  }
  last = s;
  const playing = s.conns.filter((c) => c.place.startsWith("match")).length;
  const waiting = s.conns.filter((c) => c.place === "queue" || c.place.startsWith("room")).length;
  $("health").className = "pill " + (s.draining ? "warn" : "good");
  $("health").textContent = s.draining ? (s.exit_when_drained ? "draining, then restarting" : "draining") : "taking matches";
  $("counts").textContent = `${s.conns.length} online · ${playing} playing · ${waiting} waiting`;
  $("build").textContent = `v${s.version} · protocol ${s.protocol} · rules ${s.rules} · up ${ago(s.uptime_s)}`;
  $("drain").hidden = $("restart").hidden = s.draining;
  $("resume").hidden = !s.draining;
  $("n-matches").textContent = s.matches.length;
  $("n-conns").textContent = s.conns.length;
  const byId = Object.fromEntries(s.conns.map((c) => [c.id, c]));

  table($("matches"), ["Match", "Players", "Ping", "Age", "#Behind clock", "#Frontier gap", "#Worst late", "State", ""], s.matches.map((m) => {
    const behind = ms(m.clock - m.refereed);
    const gap = ms(Math.abs(m.frontiers[0] - m.frontiers[1]));
    return `<tr><td>${m.id}</td>
      <td>${esc(m.names[0])} <span class="dim">vs</span> ${esc(m.names[1])}</td>
      <td>${rtt(byId[m.conns[0]]?.rtt_ms)} / ${rtt(byId[m.conns[1]]?.rtt_ms)}</td>
      <td>${ago(m.age_s)}</td>
      <td class="num ${behind > 1000 ? "warn" : ""}">${behind} ms</td>
      <td class="num">${gap} ms</td>
      <td class="num">${ms(m.late[0])} / ${ms(m.late[1])} ms</td>
      <td>${m.over ? `<span class="dim">${esc(m.over)}</span>` : `<span class="good">playing</span>`}</td>
      <td><button data-watch="${m.id}">Watch</button> ${m.over ? "" : `<button class="danger" data-end="${m.id}">End</button>`}</td></tr>`;
  }), "No matches right now.");

  table($("conns"), ["#", "Name", "Address", "Platform", "Where", "Ping", "#Connected", ""], s.conns.map((c) => `<tr>
      <td class="num">${c.id}</td><td>${esc(c.name) || `<span class="dim">–</span>`}</td><td>${esc(c.addr)}</td><td>${esc(c.platform) || `<span class="dim">–</span>`}</td>
      <td>${esc(c.place)}</td><td>${rtt(c.rtt_ms)}</td><td class="num">${ago(c.age_s)}</td>
      <td><button data-kick="${c.id}">Kick</button> <button class="danger" data-ban="${esc(c.addr)}" data-who="${esc(c.name)}">Ban</button></td></tr>`), "Nobody is connected.");
}

// The watched match, drawn from the referee's copy of the game.
const CELL = 22;
function colors() { return [null, css("--p1"), css("--p2"), css("--p3"), css("--p4"), css("--p5"), null, css("--gar")]; }

async function drawWatch() {
  if (watching == null) return;
  let w;
  try { w = await get(`/api/watch/${watching}`); } catch (e) {
    $("watch-state").textContent = "· match is over and gone"; watching = null; return;
  }
  $("watch-id").textContent = w.id;
  $("watch-state").textContent = `· ${(w.tick / HZ).toFixed(1)} s${w.over ? " · " + w.over : ""}`;
  const box = $("watch").querySelector(".boards");
  if (box.children.length !== w.boards.length) {
    box.innerHTML = w.boards.map(() => `<figure><canvas width="${6 * CELL}" height="${13 * CELL + 4}"></canvas><figcaption></figcaption></figure>`).join("");
  }
  const pal = colors();
  w.boards.forEach((b, i) => {
    const fig = box.children[i];
    const ctx = fig.querySelector("canvas").getContext("2d");
    ctx.clearRect(0, 0, 6 * CELL, 13 * CELL + 4);
    const cell = (x, y, c, alpha) => {
      if (!pal[c]) return;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = pal[c];
      ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    };
    for (let y = 0; y < 12; y++) for (let x = 0; x < 6; x++) cell(x, y, b.cells[y * 6 + x], b.lost ? 0.35 : 1);
    for (let x = 0; x < 6; x++) cell(x, 12, b.next_row[x], 0.35);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = css("--ink");
    ctx.lineWidth = 2;
    ctx.strokeRect(b.cursor[0] * CELL, b.cursor[1] * CELL, 2 * CELL, CELL);
    fig.querySelector("figcaption").innerHTML =
      `<b>${esc(w.names[i])}</b> · ${b.score} pts${b.chain > 1 ? ` · <span class="good">chain ${b.chain}</span>` : ""}` +
      `${b.incoming ? ` · <span class="warn">${b.incoming} incoming</span>` : ""}${b.lost ? ` · <span class="bad">topped out</span>` : ""}`;
  });
}

function watch(id) {
  watching = id;
  $("watch").hidden = false;
  $("watch").querySelector(".boards").innerHTML = "";
  $("watch").scrollIntoView({ behavior: "smooth", block: "nearest" });
  drawWatch();
}

function chart(samples) {
  if (!samples.length) { $("chart").innerHTML = `<div class="empty">No samples yet: one is taken each minute.</div>`; return; }
  const W = 520, H = 120, P = 22;
  const t0 = samples[0][0], t1 = Math.max(samples[samples.length - 1][0], t0 + 60);
  const top = Math.max(2, ...samples.map((s) => s[1]));
  const x = (t) => P + (t - t0) / (t1 - t0) * (W - P - 4);
  const y = (v) => H - 16 - v / top * (H - 26);
  const line = (k) => samples.map((s, i) => `${i ? "L" : "M"}${x(s[0]).toFixed(1)},${y(s[k]).toFixed(1)}`).join("");
  $("chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Players online and playing over the last 24 hours">
    <line x1="${P}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="${css("--line")}"/>
    <line x1="${P}" x2="${W}" y1="${y(top)}" y2="${y(top)}" stroke="${css("--line")}" stroke-dasharray="3 3"/>
    <text x="0" y="${y(top) + 4}">${top}</text><text x="0" y="${y(0) + 4}">0</text>
    <path d="${line(1)}" fill="none" stroke="${css("--accent")}" stroke-width="2"/>
    <path d="${line(2)}" fill="none" stroke="${css("--good")}" stroke-width="2"/>
    <text x="${P}" y="${H - 2}">${when(t0)}</text><text x="${W}" y="${H - 2}" text-anchor="end">${when(t1)}</text>
  </svg>
  <div class="row" style="font-size:12px"><span style="color:${css("--accent")}">━ online</span><span style="color:${css("--good")}">━ playing</span></div>`;
}

function bars(el, rows, emptyText) {
  if (!rows.length) { el.innerHTML = `<div class="empty">${emptyText}</div>`; return; }
  const top = Math.max(...rows.map((r) => r[1]));
  el.innerHTML = rows.map(([k, v]) => `<span>${esc(k)}</span><div class="bar" style="width:${v / top * 100}%"></div><span class="dim">${v}</span>`).join("");
}

async function slow() {
  try {
    const st = await get("/api/stats?hours=24");
    chart(st.samples);
    $("totals").textContent = `${st.matches} matches from ${st.players} addresses`;
    bars($("reasons"), st.reasons, "No matches yet.");
    const buckets = [[50, "< 50 ms"], [100, "50–100 ms"], [200, "100–200 ms"], [400, "200–400 ms"], [Infinity, "400 ms +"]];
    const counts = buckets.map(([lim, label]) => [label, 0]);
    for (const t of st.late) { const v = ms(t); counts[buckets.findIndex(([lim]) => v < lim)][1]++; }
    bars($("late"), st.late.length ? counts : [], "No finished matches yet.");

    const h = await get("/api/history?limit=50");
    const won = (m, i) => m.winner === i ? `<b>${esc(m.names[i])}</b>` : esc(m.names[i]);
    table($("history"), ["Match", "Started", "Players", "#Length", "Ended by", "#Worst late", "Replay"], h.map((m) => `<tr>
      <td>${m.id}</td><td>${when(m.started)}</td>
      <td>${won(m, 0)} <span class="dim">vs</span> ${won(m, 1)}${m.winner === 2 ? ` <span class="dim">(draw)</span>` : ""}</td>
      <td class="num">${m.end_tick != null ? (m.end_tick / HZ).toFixed(0) + " s" : "–"}</td>
      <td class="${["wrong_state", "bad_input"].includes(m.reason) ? "bad" : m.reason ? "" : "good"}">${esc(m.reason ?? "playing")}</td>
      <td class="num">${m.late[0] != null ? `${ms(m.late[0])} / ${ms(m.late[1])} ms` : "–"}</td>
      <td>${m.replay ? `<a href="/api/replay/${m.id}">download</a>` : `<span class="dim">–</span>`}</td></tr>`), "No matches recorded yet.");

    const b = await get("/api/bans");
    table($("bans"), ["Address", "Since", "Why", ""], b.map((x) => `<tr><td>${esc(x.addr)}</td><td>${when(x.at)}</td><td>${esc(x.note)}</td>
      <td><button data-unban="${esc(x.addr)}">Unban</button></td></tr>`), "Nobody is banned.");

    const a = await get("/api/audit?limit=30");
    table($("audit"), ["When", "What"], a.map((x) => `<tr><td>${when(x.at)}</td><td>${esc(x.what)}</td></tr>`), "Nothing yet.");
  } catch (e) {
    for (const id of ["chart", "reasons", "late"]) $(id).innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

document.addEventListener("click", (ev) => {
  const d = ev.target.closest("button")?.dataset;
  if (!d) return;
  if (d.watch) watch(Number(d.watch));
  if (d.end) act({ end: { match: Number(d.end) } }, `End match ${d.end} as a draw?`);
  if (d.kick) act({ kick: { conn: Number(d.kick) } }, `Kick connection ${d.kick}? If they're playing, their opponent wins.`);
  if (d.ban) {
    const note = prompt(`Ban ${d.ban}${d.who ? ` (${d.who})` : ""}? Why:`);
    if (note != null) act({ ban: { addr: d.ban, note } });
  }
  if (d.unban) act({ unban: { addr: d.unban } }, `Unban ${d.unban}?`);
});
$("send").onclick = () => { const text = $("notice").value.trim(); if (text) act({ notice: { text } }).then(() => $("notice").value = ""); };
$("notice").onkeydown = (e) => { if (e.key === "Enter") $("send").click(); };
$("ban").onclick = () => { const addr = $("ban-addr").value.trim(); if (addr) act({ ban: { addr, note: $("ban-note").value.trim() } }); };
$("drain").onclick = () => act({ drain: { on: true, exit: false } }, "Stop starting new matches? Games in progress carry on.");
$("restart").onclick = () => act({ drain: { on: true, exit: true } }, "Stop starting new matches, and stop the server when the last one ends? systemd starts it again, on whatever binary is installed.");
$("resume").onclick = () => act({ drain: { on: false, exit: false } });
$("unwatch").onclick = () => { watching = null; $("watch").hidden = true; };

refresh();
slow();
setInterval(refresh, 1000);
setInterval(slow, 15000);
setInterval(drawWatch, 100);
</script>
</body>
</html>
