[package]
name = "fbg-server"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Pairs players, relays their inputs and referees their matches with the real rules"

[dependencies]
axum = "0.8"
base64 = "0.22"
fbg-sim = { path = "../sim" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
