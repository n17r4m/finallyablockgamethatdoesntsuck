# The game's site: the web build, and /ws passed to the match server. tools/deploy.sh writes
# this into /etc/nginx/sites-available with DOMAIN filled in, and certbot --nginx adds https.
# The admin console is not here: it stays on 127.0.0.1:47111, for an ssh tunnel.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/fbg;
    index index.html;

    location = /ws {
        proxy_pass http://127.0.0.1:47110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A match can go quiet between games, and inputs mustn't wait for a fuller buffer.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        tcp_nodelay on;
    }

    location / {
        try_files $uri $uri/ =404;
        # File names don't change between builds, so always check for a newer one.
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/octet-stream text/css;
}
